<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Join on Ophixe</title>
<meta name="description" content="You were invited to join a company community on Ophixe." />
<meta name="theme-color" content="#0a0a0b" />
<link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<meta property="og:title" content="Join on Ophixe" />
<meta property="og:description" content="You were invited to join a company community on Ophixe." />
<meta property="og:image" content="assets/icon-512.png" />
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #0a0a0b; color: #f5f5f7; }
  #bg-canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .aurora {
    position: fixed; z-index: 0; pointer-events: none;
    width: 60vmax; height: 60vmax; border-radius: 50%;
    filter: blur(90px); opacity: 0.16;
    top: -20vmax; right: -15vmax;
    background: radial-gradient(circle, #3ee6c4 0%, transparent 65%);
    animation: drift 24s ease-in-out infinite alternate;
  }
  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to { transform: translate(-9vmax, 7vmax) scale(1.15); }
  }
  @media (prefers-reduced-motion: reduce) { #bg-canvas, .aurora { display: none; } }
  main { max-width: 420px; margin: 0 auto; padding: 64px 24px; text-align: center; position: relative; z-index: 1; }
  img.logo { width: 72px; height: 72px; border-radius: 18px; animation: logo-float 5s ease-in-out infinite; }
  @keyframes logo-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  h1 { font-size: 30px; margin: 16px 0 8px; letter-spacing: -0.5px; }
  p { color: #a7a7b0; line-height: 1.5; }
  .code-box {
    background: #141417; border: 1px solid #2e2e36; border-radius: 16px;
    padding: 20px; margin: 24px 0;
  }
  .code-box small { font-size: 11px; font-weight: 800; letter-spacing: 2px; color: #a7a7b0; }
  code { display: block; color: #fff; font-size: 30px; font-weight: 800; letter-spacing: 6px; margin-top: 8px; }
  a.btn { display: block; margin: 12px 0; padding: 16px; border-radius: 12px; font-weight: 800; text-decoration: none; transition: transform 0.18s ease, box-shadow 0.18s ease; }
  a.btn:hover { transform: translateY(-2px); }
  a.primary:hover { box-shadow: 0 12px 32px rgba(245, 245, 247, 0.25); }
  a.ghost:hover { box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5); border-color: #3ee6c4; }
  a.primary { background: #f5f5f7; color: #000; }
  a.ghost { border: 1px solid #2e2e36; color: #fff; }
  #status { font-size: 14px; min-height: 22px; }
  .home { margin-top: 24px; font-size: 14px; }
  .home a { color: #3ee6c4; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<canvas id="bg-canvas" aria-hidden="true"></canvas>
<div class="aurora" aria-hidden="true"></div>
<main>
  <img class="logo" src="assets/icon.svg" alt="Ophixe logo" />
  <h1>You're invited</h1>
  <p>Join your company community on Ophixe.</p>
  <div class="code-box">
    <small>INVITE CODE</small>
    <code id="code">…</code>
  </div>
  <p id="status">Opening the app…</p>
  <a id="open" class="btn primary" href="#">Open in app</a>
  <a id="store" class="btn ghost" href="https://play.google.com/store/apps/details?id=com.ophixe.app">Get the app</a>
  <p class="home"><a href="index.html">← Back to ophixe.com</a></p>
</main>
<script>
  (function () {
    var code = new URLSearchParams(location.search).get('code') || '';
    document.getElementById('code').textContent = code || '—';
    var appUrl = 'ophixe://join?code=' + encodeURIComponent(code);
    var storeUrl = document.getElementById('store').href;
    document.getElementById('open').href = appUrl;
    if (!code) {
      document.getElementById('status').textContent = 'This invite link has no code.';
      return;
    }
    var left = false;
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) left = true;
    });
    window.location.href = appUrl;
    setTimeout(function () {
      if (!left) {
        document.getElementById('status').textContent =
          'App not installed — taking you to download it…';
        window.location.href = storeUrl;
      }
    }, 1500);
  })();
</script>
<script>
  // Floating particles, shared look with the landing page.
  (function () {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var canvas = document.getElementById('bg-canvas');
    if (!canvas || !canvas.getContext) return;
    var ctx = canvas.getContext('2d');
    var W = 0, H = 0, parts = [];
    var COLORS = ['62,230,196', '108,92,231', '245,245,247'];
    function resize() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = W * dpr; canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function spawn(n) {
      parts = [];
      for (var i = 0; i < n; i++) {
        parts.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: 0.8 + Math.random() * 2.2,
          vx: (Math.random() - 0.5) * 0.22,
          vy: -0.06 - Math.random() * 0.22,
          c: COLORS[(Math.random() * COLORS.length) | 0],
          a: 0.15 + Math.random() * 0.45,
          tw: Math.random() * Math.PI * 2,
          ts: 0.004 + Math.random() * 0.012
        });
      }
    }
    function tick() {
      if (!document.hidden) {
        ctx.clearRect(0, 0, W, H);
        for (var i = 0; i < parts.length; i++) {
          var p = parts[i];
          p.x += p.vx; p.y += p.vy; p.tw += p.ts;
          if (p.y < -8) { p.y = H + 8; p.x = Math.random() * W; }
          if (p.x < -8) p.x = W + 8; else if (p.x > W + 8) p.x = -8;
          var alpha = p.a * (0.6 + 0.4 * Math.sin(p.tw));
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(' + p.c + ',' + alpha.toFixed(3) + ')';
          ctx.fill();
        }
      }
      requestAnimationFrame(tick);
    }
    resize();
    spawn(Math.min(70, Math.max(28, (W * H) / 26000 | 0)));
    window.addEventListener('resize', function () {
      resize();
      spawn(Math.min(70, Math.max(28, (W * H) / 26000 | 0)));
    });
    requestAnimationFrame(tick);
  })();
</script>
</body>
</html>
